<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What to eat? - Email Verification</title>
    <style>
      :root {
        --bg: #f7f3e8;
        --card: #fffdf6;
        --text: #2f241b;
        --ok: #216e39;
        --border: #dbc8ad;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, var(--bg), #f1e8d6);
        color: var(--text);
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 28px rgba(80, 53, 28, 0.12);
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(24px, 3vw, 32px);
      }
      p {
        margin: 10px 0;
        line-height: 1.6;
        font-size: clamp(17px, 2vw, 20px);
      }
      .ok {
        color: var(--ok);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1 id="title">Email verification completed</h1>
        <p class="ok" id="headline">Your account email has been successfully verified.</p>
        <p id="instruction">
          Please return to the app and tap "Confirmation verified" to complete account activation.
        </p>
      </section>
    </main>
    <script>
      (function () {
        const i18n = {
          en: {
            title: "Email verification completed",
            headline: "Your account email has been successfully verified.",
            instruction:
              'Please return to the app and tap "Confirmation verified" to complete account activation.',
          },
          "zh-tw": {
            title: "信箱驗證已完成",
            headline: "你的帳號信箱已成功完成驗證。",
            instruction: '請返回 App，按下「確認信件已驗證」，完成帳號啟用流程。',
          },
          es: {
            title: "Verificación de correo completada",
            headline: "Tu correo de cuenta se verificó correctamente.",
            instruction:
              'Vuelve a la app y toca "Confirmación verificada" para completar la activación de la cuenta.',
          },
          pt: {
            title: "Verificação de e-mail concluída",
            headline: "O e-mail da sua conta foi verificado com sucesso.",
            instruction:
              'Volte ao app e toque em "Confirmação verificada" para concluir a ativação da conta.',
          },
          fr: {
            title: "Vérification de l'e-mail terminée",
            headline: "L'e-mail de votre compte a été vérifié avec succès.",
            instruction:
              'Revenez dans l\'app et appuyez sur "Confirmation vérifiée" pour finaliser l\'activation du compte.',
          },
          de: {
            title: "E-Mail-Bestätigung abgeschlossen",
            headline: "Die E-Mail deines Kontos wurde erfolgreich bestätigt.",
            instruction:
              'Bitte zur App zurückkehren und auf "Bestätigung abgeschlossen" tippen, um die Kontoaktivierung zu beenden.',
          },
          it: {
            title: "Verifica email completata",
            headline: "L'e-mail del tuo account è stata verificata con successo.",
            instruction:
              'Torna all\'app e tocca "Conferma verificata" per completare l\'attivazione dell\'account.',
          },
          ja: {
            title: "メール認証が完了しました",
            headline: "アカウントのメールアドレス認証に成功しました。",
            instruction:
              'アプリに戻り、「確認メール認証済み」をタップしてアカウント有効化を完了してください。',
          },
          ko: {
            title: "이메일 인증이 완료되었습니다",
            headline: "계정 이메일 인증이 성공적으로 완료되었습니다.",
            instruction:
              '앱으로 돌아가 "확인 메일 인증 완료"를 눌러 계정 활성화를 마무리하세요.',
          },
          ar: {
            title: "اكتملت عملية التحقق من البريد الإلكتروني",
            headline: "تم التحقق من بريد حسابك بنجاح.",
            instruction:
              'يرجى العودة إلى التطبيق والضغط على "تم تأكيد البريد" لإكمال تفعيل الحساب.',
          },
          ru: {
            title: "Подтверждение почты завершено",
            headline: "Почта вашей учетной записи успешно подтверждена.",
            instruction:
              'Вернитесь в приложение и нажмите "Подтверждение выполнено", чтобы завершить активацию аккаунта.',
          },
        };

        const lang = (navigator.language || "en").toLowerCase();
        const key = lang.startsWith("zh") ? "zh-tw" : lang.split("-")[0];
        const text = i18n[key] || i18n.en;

        document.documentElement.lang = key;
        document.getElementById("title").textContent = text.title;
        document.getElementById("headline").textContent = text.headline;
        document.getElementById("instruction").textContent = text.instruction;
      })();
    </script>
  </body>
</html>
